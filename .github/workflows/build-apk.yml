name: Build CINEMATRIX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies, Generate Icons & Add Android Platform
        run: |
          npm install
          node assets/generate-icons.js
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0D0D0D' --splashBackgroundColor '#0D0D0D'
          npx cap sync android

      - name: Make Gradlew Executable & Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CINEMATRIX APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CINEMATRIX-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
